<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Address Book</title>
  </head>
  <body class="min-h-screen bg-gray-100 p-8 font-sans">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Address Book</h1>

    <div class="flex gap-8 items-start">
      <div class="bg-white rounded-2xl shadow-md p-6 w-80 shrink-0">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Add Contact</h2>
        <form id="contact-form" class="flex flex-col gap-3">
          <div class="flex flex-col gap-1">
            <label for="first-name" class="text-sm font-medium text-gray-600"
              >First Name</label
            >
            <input
              type="text"
              id="first-name"
              name="firstName"
              placeholder="First name"
              required
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label for="last-name" class="text-sm font-medium text-gray-600"
              >Last Name</label
            >
            <input
              type="text"
              id="last-name"
              name="lastName"
              placeholder="Last name"
              required
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label for="job-title" class="text-sm font-medium text-gray-600"
              >Job Title</label
            >
            <input
              type="text"
              id="job-title"
              name="jobTitle"
              placeholder="Job title"
              required
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label for="email" class="text-sm font-medium text-gray-600"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label for="phone-number" class="text-sm font-medium text-gray-600"
              >Phone Number</label
            >
            <input
              type="tel"
              id="phone-number"
              name="phoneNumber"
              placeholder="Phone number"
              required
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label for="location" class="text-sm font-medium text-gray-600"
              >Location</label
            >
            <input
              type="text"
              id="location"
              name="location"
              placeholder="Location"
              required
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <button
            type="submit"
            class="mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-4 py-2 text-sm transition-colors"
          >
            Add Contact
          </button>
        </form>
      </div>
      <div class="flex-1">
        <form id="search" class="flex items-center gap-2 mb-4">
          <label
            for="search-input"
            class="text-sm font-medium text-gray-600 shrink-0"
            >Search</label
          >
          <input
            type="search"
            name="search"
            id="search-input"
            placeholder="Enter name"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
          <button
            class="bg-white border border-gray-300 hover:bg-gray-50 rounded-lg px-4 py-2 text-sm font-medium text-gray-700 transition-colors"
          >
            Search
          </button>
        </form>

        <div id="container">
          <ul id="contacts-list" class="flex flex-col gap-2"></ul>
        </div>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
