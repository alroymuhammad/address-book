<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Address Book</title>
  </head>
  <body>
    <h1 class="text-3xl font-bold underline">Address book</h1>
    <form id="search">
      <label for="search-input">Search</label>
      <input
        type="search"
        name="search"
        id="search-input"
        placeholder="Enter name"
        class="mx-2 border border-gray-400 rounded px-2 py-1"
      />
      <button class="mx-2 px-4 py-1 border border-gray-600 rounded">
        Search
      </button>
    </form>
    <form
      id="contact-form"
      class="mt-4 border border-gray-300 rounded p-4 my-2 max-w-sm"
    >
      <div class="my-2">
        <label for="first-name">First Name</label>
        <input
          type="text"
          id="first-name"
          name="firstName"
          placeholder="Input first name"
          required
          class="mx-2 border border-gray-400 rounded px-2 py-1"
        />
      </div>
      <div class="my-2">
        <label for="last-name">Last Name</label>
        <input
          type="text"
          id="last-name"
          name="lastName"
          placeholder="Input last name"
          required
          class="mx-2 border border-gray-400 rounded px-2 py-1"
        />
      </div>
      <div class="my-2">
        <label for="job-title">Job Title</label>
        <input
          type="text"
          id="job-title"
          name="jobTitle"
          placeholder="Input job title"
          required
          class="mx-2 border border-gray-400 rounded px-2 py-1"
        />
      </div>
      <div class="my-2">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Input email"
          required
          class="mx-2 border border-gray-400 rounded px-2 py-1"
        />
      </div>
      <div class="my-2">
        <label for="phone-number">Phone Number</label>
        <input
          type="tel"
          id="phone-number"
          name="phoneNumber"
          placeholder="Input phone number"
          required
          class="mx-2 border border-gray-400 rounded px-2 py-1"
        />
      </div>
      <div class="my-2">
        <label for="location">Location</label>
        <input
          type="text"
          id="location"
          name="location"
          placeholder="Input location"
          required
          class="mx-2 border border-gray-400 rounded px-2 py-1"
        />
      </div>
      <button
        type="submit"
        class="mt-2 mx-2 px-4 py-1 border border-gray-600 rounded"
      >
        Add Contact
      </button>
    </form>

    <div id="container">
      <ul id="contacts-list"></ul>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
